name: Update Alpha Badge

on:
  push:
    branches: [main]
    paths:
      - 'wip/guide*alpha*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository with SSH
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Update alpha badge
        run: python scripts/update-alpha-badge.py

      - name: ⚙️ Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: 💾 Commit and push if changed
        run: |
          git add README.md docs/index.html
          if git diff --staged --quiet; then
            echo "ℹ No changes to commit"
          else
            git commit -m "chore(badge): update alpha pre-release badge [skip ci]"
            git push origin main
            echo "✓ Alpha badge updated"
          fi

      - name: ✅ Log result
        if: success()
        run: |
          echo "═══════════════════════════════════════════════"
          echo "✅ Alpha badge update complete"
          echo "═══════════════════════════════════════════════"
          echo "📅 Date: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🔗 Repository: ${{ github.repository }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "═══════════════════════════════════════════════"

      - name: ❌ Log error (if failed)
        if: failure()
        run: |
          echo "❌ Alpha badge update FAILED"
          echo "Trigger: ${{ github.event_name }}"
