name: 📊 Update Forum Views Badge (DEBUG)

# Trigger: Every 2 hours
on:
  schedule:
    - cron: "0 10 * * *"  # once a day (10 am UTC)
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-forum-badge:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository with SSH
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔄 Scrape forum topic views (DEBUG)
        env:
          FORUM_TOPIC_URL: ${{ secrets.FORUM_TOPIC_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 scripts/scrape-forum-views-debug.py 2>&1

      - name: ⚙️ Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 💾 Commit and push changes
        run: |
          if git diff --quiet README.md; then
            echo "ℹ️  No changes to README"
            exit 0
          fi
          
          git add README.md
          git commit -m "chore: update forum views badge ⬆️"
          git push origin main
          echo "✅ README updated and pushed"

      - name: ✅ Log success
        if: success()
        run: |
          echo "═══════════════════════════════════════════════"
          echo "✅ Forum Views Badge Updated Successfully"
          echo "═══════════════════════════════════════════════"
          echo "📅 Timestamp: $(date -u +%Y-%m-%d' '%H:%M:%S' 'UTC)"
          echo "🔗 Repository: ${{ github.repository }}"
          echo "═══════════════════════════════════════════════"

      - name: ❌ Log failure
        if: failure()
        run: |
          echo "❌ Forum Views Badge Update FAILED"
          echo "Please check:"
          echo "  1. FORUM_TOPIC_URL secret configured"
          echo "  2. DEPLOY_KEY secret configured"
          echo "  3. GH_TOKEN secret configured"
          echo "  4. Topic URL valid and accessible"
