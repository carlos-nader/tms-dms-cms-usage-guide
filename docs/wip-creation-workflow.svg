<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 970">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="970" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="430" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">WIP File Creation Workflow</text>
  <text x="430" y="70" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" text-anchor="middle">from Canonical Template</text>

  <!-- Step 0: Warning -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="320" height="70" rx="10" fill="#DC3545" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 0</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="13" fill="#FFF" font-weight="bold">⚠ NEVER modify</text>
    <text x="20" y="63" font-family="Arial, sans-serif" font-size="11" fill="#FFF">templates/template-wip.tex directly</text>
  </g>

  <!-- Template box (right side) -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="360" height="90" rx="8" fill="#FFF" stroke="#DEE2E6" stroke-width="2"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Template Contents</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="12" fill="#6C757D">• Preamble (geometry, packages, macros)</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="12" fill="#6C757D">• Metadata block (lines 52–75)</text>
    <text x="20" y="84" font-family="Arial, sans-serif" font-size="12" fill="#6C757D">• hotastable environment pre-configured</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 175 L 210 200" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,210 205,200 215,200" fill="#6C757D"/>

  <!-- Step 1: Copy -->
  <g transform="translate(50, 210)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 1: Copy Template</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Copy: templates/template-wip.tex</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">To: wip/[temporary-name].tex</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 295 L 210 320" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,330 205,320 215,320" fill="#6C757D"/>

  <!-- Step 2: Rename -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 2: Rename Following Patterns</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">chapter-C{N}-{title}-{status}-{date}.tex</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">section-C{N}-S{M}-{title}-{status}-{date}.tex</text>
  </g>

  <!-- Naming patterns box -->
  <g transform="translate(450, 210)">
    <rect x="0" y="0" width="360" height="210" rx="8" fill="#FFF" stroke="#DEE2E6" stroke-width="2"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Naming Patterns</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Chapter:</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">chapter-C4-dms-dev-2026-02-03.tex</text>
    <text x="20" y="88" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Section:</text>
    <text x="20" y="104" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">section-C4-S2-dms-up-dev-2026-02-03.tex</text>
    <text x="20" y="126" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Table:</text>
    <text x="20" y="142" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">table-C3-AA-TMS-dev-2026-02-03.tex</text>
    <text x="20" y="164" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Notes:</text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">notes-C5-cms-research-2026-02-03.md</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Visual:</text>
    <text x="20" y="218" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">visual-C7-tms-diagram-dev-2026-02-03.svg</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 425 L 210 450" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,460 205,450 215,450" fill="#6C757D"/>

  <!-- Step 3: Edit metadata -->
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 3: Edit Metadata Block</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Target chapter, section, subsection</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Current status, notes, TODOs</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 555 L 210 580" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,590 205,580 215,580" fill="#6C757D"/>

  <!-- Step 4: Fill content -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 4: Fill Content</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Write narrative, populate hotastable rows</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Add visual descriptions and references</text>
  </g>

  <!-- Arrow down -->
  <path d="M 210 685 L 210 710" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,720 205,710 215,710" fill="#6C757D"/>

  <!-- Step 5: Update status -->
  <g transform="translate(50, 730)">
    <rect x="0" y="0" width="320" height="90" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 5: Update Status as You Progress</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">dev → review → final [→ alpha]</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Rename file when status changes</text>
    <text x="20" y="82" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" font-style="italic">Alpha path optional — see Status Progression →</text>
  </g>

  <!-- ================================================ -->
  <!-- Status Progression panel (right side, expanded)  -->
  <!-- ================================================ -->
  <g transform="translate(450, 470)">
    <rect x="0" y="0" width="360" height="420" rx="8" fill="#FFF" stroke="#DEE2E6" stroke-width="2"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Status Progression</text>

    <!-- dev -->
    <rect x="15" y="45" width="210" height="46" rx="6" fill="#F1C40F"/>
    <text x="120" y="67" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">dev</text>
    <text x="120" y="83" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Never reviewed by human</text>

    <!-- dev → review -->
    <path d="M 120 95 L 120 110" stroke="#6C757D" stroke-width="2"/>
    <polygon points="120,115 115,107 125,107" fill="#6C757D"/>

    <!-- review -->
    <rect x="15" y="118" width="210" height="46" rx="6" fill="#E67E22"/>
    <text x="120" y="140" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">review</text>
    <text x="120" y="156" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Under human iteration</text>

    <!-- review → final -->
    <path d="M 120 168 L 120 183" stroke="#6C757D" stroke-width="2"/>
    <polygon points="120,188 115,180 125,180" fill="#6C757D"/>

    <!-- final -->
    <rect x="15" y="191" width="210" height="46" rx="6" fill="#3498DB"/>
    <text x="120" y="213" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">final</text>
    <text x="120" y="229" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Ready to integrate</text>

    <!-- FORK from final -->
    <!-- Standard arrow (left-of-center, straight down) -->
    <path d="M 85 241 L 85 276" stroke="#6C757D" stroke-width="2"/>
    <polygon points="85,281 80,273 90,273" fill="#6C757D"/>
    <text x="56" y="262" font-family="Arial, sans-serif" font-size="9" fill="#6C757D">std.</text>

    <!-- Alpha branch (right side of final → dashed right to alpha) -->
    <path d="M 227 214 L 248 214" stroke="#1565C0" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="254,214 246,210 246,218" fill="#1565C0"/>

    <!-- alpha node -->
    <rect x="256" y="196" width="90" height="46" rx="8" fill="#1565C0" filter="url(#shadow)"/>
    <text x="301" y="218" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">alpha</text>
    <text x="301" y="234" font-family="Arial, sans-serif" font-size="9" fill="#90CAF9" text-anchor="middle">optional</text>

    <!-- Arrow from alpha → approved (down then left, dashed) -->
    <path d="M 301 244 L 301 295 L 228 295" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
    <polygon points="225,295 233,291 233,299" fill="#1565C0"/>
    <text x="275" y="278" font-family="Arial, sans-serif" font-size="9" fill="#1565C0">batch</text>

    <!-- approved -->
    <rect x="15" y="284" width="210" height="46" rx="6" fill="#27AE60"/>
    <text x="120" y="306" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">approved</text>
    <text x="120" y="322" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Integrated → archive/WIP/</text>

    <!-- Separator -->
    <line x1="15" y1="352" x2="345" y2="352" stroke="#DEE2E6" stroke-width="1"/>

    <!-- Alpha note -->
    <rect x="15" y="360" width="330" height="45" rx="5" fill="#E3F2FD" stroke="#1565C0" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="180" y="378" font-family="Arial, sans-serif" font-size="10" fill="#1565C0" text-anchor="middle" font-weight="bold">Alpha path: optional</text>
    <text x="180" y="394" font-family="Arial, sans-serif" font-size="10" fill="#1565C0" text-anchor="middle">activated only with pre-release infrastructure</text>
  </g>

  <!-- Footer -->
  <text x="430" y="948" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D" text-anchor="middle">WIP-FILE-NAMING | All files start from templates/template-wip.tex</text>
</svg>
