<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="900" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">WIP File Creation Workflow</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" text-anchor="middle">from Canonical Template</text>
  
  <!-- Step 0: Warning -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="320" height="70" rx="10" fill="#DC3545" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 0</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="13" fill="#FFF" font-weight="bold">⚠ NEVER modify</text>
    <text x="20" y="63" font-family="Arial, sans-serif" font-size="11" fill="#FFF">templates/template-wip.tex directly</text>
  </g>
  
  <!-- Template box (right side) -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="300" height="90" rx="8" fill="#FFF" stroke="#DEE2E6" stroke-width="2"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Template Contents</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="12" fill="#6C757D">• Preamble (geometry, packages, macros)</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="12" fill="#6C757D">• Metadata block (lines 52-75)</text>
    <text x="20" y="84" font-family="Arial, sans-serif" font-size="12" fill="#6C757D">• hotastable environment pre-configured</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 210 175 L 210 200" stroke="#6C757D" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 1: Copy -->
  <g transform="translate(50, 210)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 1: Copy Template</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Copy: templates/template-wip.tex</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">To: wip/[temporary-name].tex</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 210 295 L 210 320" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,330 205,320 215,320" fill="#6C757D"/>
  
  <!-- Step 2: Rename -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 2: Rename Following Patterns</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">chapter-C{N}-{title}-{status}-{date}.tex</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">section-C{N}-S{M}-{title}-{status}-{date}.tex</text>
  </g>
  
  <!-- Naming patterns box -->
  <g transform="translate(450, 210)">
    <rect x="0" y="0" width="300" height="210" rx="8" fill="#FFF" stroke="#DEE2E6" stroke-width="2"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Naming Patterns</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Chapter:</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">chapter-C4-dms-dev-2026-02-03.tex</text>
    <text x="20" y="88" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Section:</text>
    <text x="20" y="104" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">section-C4-S2-dms-up-dev-2026-02-03.tex</text>
    <text x="20" y="126" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Table:</text>
    <text x="20" y="142" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">table-C3-AA-TMS-dev-2026-02-03.tex</text>
    <text x="20" y="164" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Notes:</text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">notes-C5-cms-research-2026-02-03.md</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Visual:</text>
    <text x="20" y="218" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">visual-C7-tms-diagram-dev-2026-02-03.svg</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 210 425 L 210 450" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,460 205,450 215,450" fill="#6C757D"/>
  
  <!-- Step 3: Edit metadata -->
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 3: Edit Metadata Block</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Target chapter, section, subsection</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Current status, notes, TODOs</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 210 555 L 210 580" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,590 205,580 215,580" fill="#6C757D"/>
  
  <!-- Step 4: Fill content -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 4: Fill Content</text>
    <text x="20" y="48" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Write narrative, populate hotastable rows</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Add visual descriptions and references</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 210 685 L 210 710" stroke="#6C757D" stroke-width="2" fill="none"/>
  <polygon points="210,720 205,710 215,710" fill="#6C757D"/>
  
  <!-- Step 5: Update status -->
  <g transform="translate(50, 730)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="bold">Step 5: Update Status as You Progress</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#FFF">dev → review → final</text>
    <text x="20" y="68" font-family="Arial, sans-serif" font-size="11" fill="#FFF">Rename file when status changes</text>
  </g>
  
  <!-- Status progression box -->
  <g transform="translate(450, 470)">
    <rect x="0" y="0" width="300" height="340" rx="8" fill="#FFF" stroke="#DEE2E6" stroke-width="2"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Status Progression</text>
    
    <!-- dev -->
    <rect x="20" y="45" width="260" height="50" rx="6" fill="#F1C40F"/>
    <text x="150" y="68" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">dev</text>
    <text x="150" y="85" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Never reviewed by human</text>
    
    <!-- Arrow -->
    <path d="M 150 100 L 150 115" stroke="#6C757D" stroke-width="2"/>
    <polygon points="150,120 145,115 155,115" fill="#6C757D"/>
    
    <!-- review -->
    <rect x="20" y="125" width="260" height="50" rx="6" fill="#E67E22"/>
    <text x="150" y="148" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">review</text>
    <text x="150" y="165" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Under human iteration</text>
    
    <!-- Arrow -->
    <path d="M 150 180 L 150 195" stroke="#6C757D" stroke-width="2"/>
    <polygon points="150,200 145,195 155,195" fill="#6C757D"/>
    
    <!-- final -->
    <rect x="20" y="205" width="260" height="50" rx="6" fill="#3498DB"/>
    <text x="150" y="228" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">final</text>
    <text x="150" y="245" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Ready to integrate</text>
    
    <!-- Arrow -->
    <path d="M 150 260 L 150 275" stroke="#6C757D" stroke-width="2"/>
    <polygon points="150,280 145,275 155,275" fill="#6C757D"/>
    
    <!-- approved -->
    <rect x="20" y="285" width="260" height="45" rx="6" fill="#27AE60"/>
    <text x="150" y="308" font-family="Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="bold">approved</text>
    <text x="150" y="322" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Integrated → archive/WIP/</text>
  </g>
  
  <!-- Footer note -->
  <text x="400" y="870" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D" text-anchor="middle">WIP-FILE-NAMING | All files start from templates/template-wip.tex</text>
</svg>
