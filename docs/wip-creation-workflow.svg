<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 970"><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="2" dy="2" flood-opacity=".2" stdDeviation="3"/></filter><linearGradient id="blueGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1"/><stop offset="100%" style="stop-color:#357abd;stop-opacity:1"/></linearGradient><linearGradient id="greenGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1"/><stop offset="100%" style="stop-color:#449d44;stop-opacity:1"/></linearGradient></defs><rect width="860" height="970" fill="#F8F9FA"/><text x="430" y="45" fill="#2C3E50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">WIP File Creation Workflow</text><text x="430" y="70" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">from Canonical Template</text><g transform="translate(50, 100)"><rect width="320" height="70" x="0" y="0" fill="#DC3545" filter="url(#shadow)" rx="10"/><text x="20" y="28" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 0</text><text x="20" y="48" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">⚠ NEVER modify</text><text x="20" y="63" fill="#FFF" font-family="Arial, sans-serif" font-size="11">templates/template-wip.tex directly</text></g><g transform="translate(450, 100)"><rect width="360" height="90" x="0" y="0" fill="#FFF" stroke="#DEE2E6" stroke-width="2" rx="8"/><text x="180" y="25" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Template Contents</text><text x="20" y="48" fill="#6C757D" font-family="Arial, sans-serif" font-size="12">• Preamble (geometry, packages, macros)</text><text x="20" y="66" fill="#6C757D" font-family="Arial, sans-serif" font-size="12">• Metadata block (lines 52–75)</text><text x="20" y="84" fill="#6C757D" font-family="Arial, sans-serif" font-size="12">• hotastable environment pre-configured</text></g><path fill="none" stroke="#6C757D" stroke-width="2" d="M 210 175 L 210 200"/><polygon fill="#6C757D" points="210 210 205 200 215 200"/><g transform="translate(50, 210)"><rect width="320" height="80" x="0" y="0" fill="url(#blueGrad)" filter="url(#shadow)" rx="10"/><text x="20" y="25" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 1: Copy Template</text><text x="20" y="48" fill="#FFF" font-family="Arial, sans-serif" font-size="11">Copy: templates/template-wip.tex</text><text x="20" y="66" fill="#FFF" font-family="Arial, sans-serif" font-size="11">To: wip/[temporary-name].tex</text></g><path fill="none" stroke="#6C757D" stroke-width="2" d="M 210 295 L 210 320"/><polygon fill="#6C757D" points="210 330 205 320 215 320"/><g transform="translate(50, 340)"><rect width="320" height="80" x="0" y="0" fill="url(#blueGrad)" filter="url(#shadow)" rx="10"/><text x="20" y="25" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 2: Rename Following Patterns</text><text x="20" y="48" fill="#FFF" font-family="Arial, sans-serif" font-size="11">chapter-C{N}-{title}-{status}-{date}.tex</text><text x="20" y="66" fill="#FFF" font-family="Arial, sans-serif" font-size="11">section-C{N}-S{M}-{title}-{status}-{date}.tex</text></g><g transform="translate(450, 210)"><rect width="360" height="210" x="0" y="0" fill="#FFF" stroke="#DEE2E6" stroke-width="2" rx="8"/><text x="180" y="25" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Naming Patterns</text><text x="20" y="50" fill="#495057" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Chapter:</text><text x="20" y="66" fill="#6C757D" font-family="Arial, sans-serif" font-size="10">chapter-C4-dms-dev-2026-02-03.tex</text><text x="20" y="88" fill="#495057" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Section:</text><text x="20" y="104" fill="#6C757D" font-family="Arial, sans-serif" font-size="10">section-C4-S2-dms-up-dev-2026-02-03.tex</text><text x="20" y="126" fill="#495057" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Table:</text><text x="20" y="142" fill="#6C757D" font-family="Arial, sans-serif" font-size="10">table-C3-AA-TMS-dev-2026-02-03.tex</text><text x="20" y="164" fill="#495057" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Notes:</text><text x="20" y="180" fill="#6C757D" font-family="Arial, sans-serif" font-size="10">notes-C5-cms-research-2026-02-03.md</text><text x="20" y="202" fill="#495057" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Visual:</text><text x="20" y="218" fill="#6C757D" font-family="Arial, sans-serif" font-size="10">visual-C7-tms-diagram-dev-2026-02-03.svg</text></g><path fill="none" stroke="#6C757D" stroke-width="2" d="M 210 425 L 210 450"/><polygon fill="#6C757D" points="210 460 205 450 215 450"/><g transform="translate(50, 470)"><rect width="320" height="80" x="0" y="0" fill="url(#blueGrad)" filter="url(#shadow)" rx="10"/><text x="20" y="25" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 3: Edit Metadata Block</text><text x="20" y="48" fill="#FFF" font-family="Arial, sans-serif" font-size="11">Target chapter, section, subsection</text><text x="20" y="66" fill="#FFF" font-family="Arial, sans-serif" font-size="11">Current status, notes, TODOs</text></g><path fill="none" stroke="#6C757D" stroke-width="2" d="M 210 555 L 210 580"/><polygon fill="#6C757D" points="210 590 205 580 215 580"/><g transform="translate(50, 600)"><rect width="320" height="80" x="0" y="0" fill="url(#blueGrad)" filter="url(#shadow)" rx="10"/><text x="20" y="25" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 4: Fill Content</text><text x="20" y="48" fill="#FFF" font-family="Arial, sans-serif" font-size="11">Write narrative, populate hotastable rows</text><text x="20" y="66" fill="#FFF" font-family="Arial, sans-serif" font-size="11">Add visual descriptions and references</text></g><path fill="none" stroke="#6C757D" stroke-width="2" d="M 210 685 L 210 710"/><polygon fill="#6C757D" points="210 720 205 710 215 710"/><g transform="translate(50, 730)"><rect width="320" height="90" x="0" y="0" fill="url(#greenGrad)" filter="url(#shadow)" rx="10"/><text x="20" y="25" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 5: Update Status as You Progress</text><text x="20" y="48" fill="#FFF" font-family="Arial, sans-serif" font-size="11">dev → review → final [→ alpha]</text><text x="20" y="66" fill="#FFF" font-family="Arial, sans-serif" font-size="11">Rename file when status changes</text><text x="20" y="82" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="10" font-style="italic">Alpha path optional — see Status Progression →</text></g><g transform="translate(450, 470)"><rect width="360" height="420" x="0" y="0" fill="#FFF" stroke="#DEE2E6" stroke-width="2" rx="8"/><text x="180" y="25" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Status Progression</text><rect width="210" height="46" x="15" y="45" fill="#F1C40F" rx="6"/><text x="120" y="67" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">dev</text><text x="120" y="83" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Never reviewed by human</text><path stroke="#6C757D" stroke-width="2" d="M 120 95 L 120 110"/><polygon fill="#6C757D" points="120 115 115 107 125 107"/><rect width="210" height="46" x="15" y="118" fill="#E67E22" rx="6"/><text x="120" y="140" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">review</text><text x="120" y="156" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Under human iteration</text><path stroke="#6C757D" stroke-width="2" d="M 120 168 L 120 183"/><polygon fill="#6C757D" points="120 188 115 180 125 180"/><rect width="210" height="46" x="15" y="191" fill="#3498DB" rx="6"/><text x="120" y="213" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">final</text><text x="120" y="229" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Ready to integrate</text><path stroke="#6C757D" stroke-width="2" d="M 85 241 L 85 276"/><polygon fill="#6C757D" points="85 281 80 273 90 273"/><text x="56" y="262" fill="#6C757D" font-family="Arial, sans-serif" font-size="9">std.</text><path stroke="#1565C0" stroke-dasharray="4 2" stroke-width="2" d="M 227 214 L 248 214"/><polygon fill="#1565C0" points="254 214 246 210 246 218"/><rect width="90" height="46" x="256" y="196" fill="#1565C0" filter="url(#shadow)" rx="8"/><text x="301" y="218" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">alpha</text><text x="301" y="234" fill="#90CAF9" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">optional</text><path fill="none" stroke="#1565C0" stroke-dasharray="4 2" stroke-width="1.5" d="M 301 244 L 301 295 L 228 295"/><polygon fill="#1565C0" points="225 295 233 291 233 299"/><text x="275" y="278" fill="#1565C0" font-family="Arial, sans-serif" font-size="9">batch</text><rect width="210" height="46" x="15" y="284" fill="#27AE60" rx="6"/><text x="120" y="306" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">approved</text><text x="120" y="322" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Integrated → archive/WIP/</text><line x1="15" x2="345" y1="352" y2="352" stroke="#DEE2E6" stroke-width="1"/><rect width="330" height="45" x="15" y="360" fill="#E3F2FD" stroke="#1565C0" stroke-dasharray="4 2" stroke-width="1" rx="5"/><text x="180" y="378" fill="#1565C0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Alpha path: optional</text><text x="180" y="394" fill="#1565C0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">activated only with pre-release infrastructure</text></g><text x="430" y="948" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">WIP-FILE-NAMING | All files start from templates/template-wip.tex</text></svg>