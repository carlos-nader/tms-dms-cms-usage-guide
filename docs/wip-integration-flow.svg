<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980"><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="2" dy="2" flood-opacity=".2" stdDeviation="3"/></filter><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#6C757D" points="0 0 10 3.5 0 7"/></marker><marker id="arrowBlue" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#1565C0" points="0 0 10 3.5 0 7"/></marker><marker id="arrowGreen" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#27AE60" points="0 0 10 3.5 0 7"/></marker><marker id="arrowRed" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#E74C3C" points="0 0 10 3.5 0 7"/></marker></defs><rect width="1200" height="980" fill="#F8F9FA"/><text x="600" y="40" fill="#2C3E50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">WIP Integration Flow</text><text x="600" y="65" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Standard official release vs. alpha pre-release path</text><g transform="translate(440, 90)"><rect width="320" height="55" x="0" y="0" fill="#3498DB" filter="url(#shadow)" rx="8"/><text x="160" y="24" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WIP File(s) Marked Final</text><text x="160" y="44" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">status &quot;final&quot; — ready to proceed</text></g><path stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)" d="M 600 148 L 600 172"/><polygon fill="#F39C12" points="600 172 755 215 600 258 445 215" filter="url(#shadow)"/><text x="600" y="210" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Integration type?</text><text x="600" y="228" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Release target?</text><path stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)" d="M 445 215 L 280 215 L 280 290"/><text x="355" y="203" fill="#495057" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Official</text><path stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)" d="M 755 215 L 920 215 L 920 290"/><text x="840" y="203" fill="#1565C0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alpha pre-release</text><rect width="280" height="30" x="140" y="293" fill="#34495E" rx="6"/><text x="280" y="313" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Standard Integration</text><g transform="translate(140, 338)"><rect width="280" height="68" x="0" y="0" fill="#9B59B6" filter="url(#shadow)" rx="8"/><text x="140" y="22" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step 1: Human Copies Content</text><text x="140" y="42" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">From: wip/[file]-final-*.tex</text><text x="140" y="58" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">To: wip/guide/guide-v*.tex</text></g><path stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)" d="M 280 410 L 280 428"/><g transform="translate(140, 432)"><rect width="280" height="68" x="0" y="0" fill="#9B59B6" filter="url(#shadow)" rx="8"/><text x="140" y="22" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step 2: Handle LaTeX</text><text x="140" y="42" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cross-references, labels, formatting</text><text x="140" y="58" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Ensure consistency with guide style</text></g><path stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)" d="M 280 504 L 280 522"/><polygon fill="#F39C12" points="280 522 390 555 280 588 170 555" filter="url(#shadow)"/><text x="280" y="550" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step 3: Compile</text><text x="280" y="567" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Errors?</text><path fill="none" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowRed)" d="M 170 555 L 100 555 L 100 466 L 138 466"/><text x="72" y="510" fill="#E74C3C" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Error</text><text x="72" y="524" fill="#E74C3C" font-family="Arial, sans-serif" font-size="9">Fix issues</text><path stroke="#27AE60" stroke-width="2" marker-end="url(#arrowGreen)" d="M 280 590 L 280 612"/><text x="298" y="605" fill="#27AE60" font-family="Arial, sans-serif" font-size="10" font-weight="bold">OK</text><g transform="translate(140, 616)"><rect width="280" height="82" x="0" y="0" fill="#27AE60" filter="url(#shadow)" rx="8"/><text x="140" y="20" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step 4: Update Version</text><text x="140" y="38" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Update \docversion, \docbuild macros</text><text x="140" y="54" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Save new snapshot in wip/guide/</text><text x="140" y="70" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Copy snapshot to guide.tex (root)</text></g><path stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)" d="M 280 702 L 280 720"/><g transform="translate(140, 724)"><rect width="280" height="92" x="0" y="0" fill="#34495E" filter="url(#shadow)" rx="8"/><text x="140" y="20" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step 5: Archive and Track</text><text x="140" y="40" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Move old snapshot → archive/GUIDE/</text><text x="140" y="56" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Move WIP → archive/WIP/ (approved)</text><text x="140" y="72" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Update project-tracking</text><text x="140" y="88" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Create GitHub tag + official release</text></g><path stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)" d="M 280 820 L 280 855"/><ellipse cx="280" cy="878" fill="#FFF" stroke="#2C3E50" stroke-width="2" rx="55" ry="22"/><text x="280" y="883" fill="#2C3E50" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">End</text><rect width="280" height="30" x="780" y="293" fill="#0D47A1" rx="6"/><text x="920" y="313" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Alpha Pre-release</text><g transform="translate(780, 338)"><rect width="280" height="62" x="0" y="0" fill="#1565C0" filter="url(#shadow)" rx="8"/><text x="140" y="22" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step α1: Mark WIPs as Alpha</text><text x="140" y="42" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Rename: ...-final-*.tex → ...-alpha-*.tex</text><text x="140" y="56" fill="#90CAF9" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Update metadata block in each file</text></g><path stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)" d="M 920 404 L 920 420"/><g transform="translate(780, 424)"><rect width="280" height="76" x="0" y="0" fill="#1565C0" filter="url(#shadow)" rx="8"/><text x="140" y="22" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step α2: Create Alpha Snapshot</text><text x="140" y="42" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">In wip/ root (NOT wip/guide/)</text><text x="140" y="58" fill="#90CAF9" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">guide-v0.4.2.0-alpha.1-20260301.tex</text><text x="140" y="72" fill="#90CAF9" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Integrate content, adjust LaTeX</text></g><path stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)" d="M 920 504 L 920 520"/><polygon fill="#F39C12" points="920 520 1030 553 920 586 810 553" filter="url(#shadow)"/><text x="920" y="548" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step α3: Compile</text><text x="920" y="565" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Errors?</text><path fill="none" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowRed)" d="M 810 553 L 748 553 L 748 462 L 778 462"/><text x="718" y="507" fill="#E74C3C" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Error</text><text x="718" y="521" fill="#E74C3C" font-family="Arial, sans-serif" font-size="9">Fix issues</text><path stroke="#27AE60" stroke-width="2" marker-end="url(#arrowGreen)" d="M 920 588 L 920 608"/><text x="938" y="603" fill="#27AE60" font-family="Arial, sans-serif" font-size="10" font-weight="bold">OK</text><g transform="translate(780, 612)"><rect width="280" height="68" x="0" y="0" fill="#1976D2" filter="url(#shadow)" rx="8"/><text x="140" y="22" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Step α4: Push Alpha Tag</text><text x="140" y="42" fill="#FFF" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">git tag v0.4.2.0-alpha.1</text><text x="140" y="58" fill="#90CAF9" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">GitHub release — mark as pre-release</text></g><path stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)" d="M 920 684 L 920 700"/><g transform="translate(780, 704)"><rect width="280" height="72" x="0" y="0" fill="#E3F2FD" stroke="#1565C0" stroke-dasharray="5 3" stroke-width="2" rx="8"/><text x="140" y="20" fill="#1565C0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WIP files remain in wip/</text><text x="140" y="38" fill="#1565C0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">NOT moved to archive/ yet.</text><text x="140" y="54" fill="#1565C0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Archived as batch (approved) when</text><text x="140" y="68" fill="#1565C0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">official release is cut.</text></g><path stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)" d="M 920 780 L 920 820"/><ellipse cx="920" cy="843" fill="#FFF" stroke="#0D47A1" stroke-width="2" rx="55" ry="22"/><text x="920" y="848" fill="#0D47A1" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">End α</text><line x1="600" x2="600" y1="280" y2="900" stroke="#DEE2E6" stroke-dasharray="8 4" stroke-width="1.5"/><text x="600" y="955" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">WIP-FILE-NAMING + VERSION-SYSTEM | Standard integration vs. alpha pre-release path</text></svg>