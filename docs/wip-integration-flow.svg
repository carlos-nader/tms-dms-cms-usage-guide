<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 950">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6C757D"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="950" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="425" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">WIP Integration Flow</text>
  <text x="425" y="65" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" text-anchor="middle">Human-driven integration into guide.tex</text>
  
  <!-- Start -->
  <ellipse cx="425" cy="110" rx="60" ry="25" fill="#FFF" stroke="#2C3E50" stroke-width="2"/>
  <text x="425" y="115" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle">Start</text>
  
  <!-- Arrow -->
  <path d="M 425 135 L 425 160" stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 1: WIP file ready -->
  <g transform="translate(275, 170)">
    <rect x="0" y="0" width="300" height="60" rx="8" fill="#3498DB" filter="url(#shadow)"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">Step 1: WIP File Ready</text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">WIP file has status "final"</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 425 235 L 425 260" stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Human copies content -->
  <g transform="translate(275, 270)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#9B59B6" filter="url(#shadow)"/>
    <text x="150" y="22" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">Step 2: Human Copies Content</text>
    <text x="150" y="42" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">From: wip/[file]-final-*.tex</text>
    <text x="150" y="58" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">To: wip/guide/guide-v*.tex</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 425 345 L 425 370" stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Human handles LaTeX -->
  <g transform="translate(275, 380)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#9B59B6" filter="url(#shadow)"/>
    <text x="150" y="22" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">Step 3: Human Handles LaTeX</text>
    <text x="150" y="42" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Cross-references, labels, formatting</text>
    <text x="150" y="58" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Ensure consistency with guide style</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 425 455 L 425 480" stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Compile -->
  <g transform="translate(275, 490)">
    <polygon points="150,0 300,40 150,80 0,40" fill="#F39C12" filter="url(#shadow)"/>
    <text x="150" y="35" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">Step 4: Compile</text>
    <text x="150" y="52" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Check for errors?</text>
  </g>
  
  <!-- Error path (loop back) -->
  <path d="M 275 530 L 200 530 L 200 425 L 270 425" stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="160" y="480" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C" font-weight="bold">Error</text>
  <text x="160" y="495" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">Fix issues</text>
  
  <!-- Success path -->
  <path d="M 425 575 L 425 600" stroke="#27AE60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="445" y="590" font-family="Arial, sans-serif" font-size="11" fill="#27AE60" font-weight="bold">OK</text>
  
  <!-- Step 5: Update version -->
  <g transform="translate(275, 610)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#27AE60" filter="url(#shadow)"/>
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">Step 5: Update Version</text>
    <text x="150" y="38" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Update \docversion, \docbuild macros</text>
    <text x="150" y="54" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Save new snapshot in wip/guide/</text>
    <text x="150" y="70" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Copy snapshot to guide.tex (root)</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 425 695 L 425 720" stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Archive and Track -->
  <g transform="translate(275, 730)">
    <rect x="0" y="0" width="300" height="90" rx="8" fill="#34495E" filter="url(#shadow)"/>
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">Step 6: Archive and Track</text>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Move previous snapshot → archive/GUIDE/</text>
    <text x="150" y="56" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Move WIP file → archive/WIP/ (rename to approved)</text>
    <text x="150" y="72" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Update PROJECT-TRACKING</text>
    <text x="150" y="88" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Create GitHub tag + release</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 425 825 L 425 850" stroke="#6C757D" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- End -->
  <ellipse cx="425" cy="880" rx="60" ry="25" fill="#FFF" stroke="#2C3E50" stroke-width="2"/>
  <text x="425" y="885" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle">End</text>
  
  <!-- Side note: Human responsibility -->
  <g transform="translate(620, 270)">
    <rect x="0" y="0" width="180" height="200" rx="8" fill="#FFF" stroke="#9B59B6" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" fill="#9B59B6" text-anchor="middle" font-weight="bold">Human Responsibility</text>
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">✓ Copy content</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">✓ Handle LaTeX</text>
    <text x="15" y="90" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">✓ Compile and verify</text>
    <text x="15" y="110" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">✓ Update version</text>
    <text x="15" y="130" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">✓ Move files</text>
    <text x="15" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">✓ Create tag/release</text>
    <line x1="15" y1="165" x2="165" y2="165" stroke="#DEE2E6" stroke-width="1"/>
    <text x="90" y="185" font-family="Arial, sans-serif" font-size="10" fill="#9B59B6" text-anchor="middle" font-style="italic">AI assists with content,</text>
    <text x="90" y="198" font-family="Arial, sans-serif" font-size="10" fill="#9B59B6" text-anchor="middle" font-style="italic">human executes integration</text>
  </g>
  
  <!-- Footer -->
  <text x="425" y="930" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D" text-anchor="middle">WIP-FILE-NAMING + VERSION-SYSTEM</text>
</svg>
