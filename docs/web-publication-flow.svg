<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820"><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="2" dy="2" flood-opacity=".2" stdDeviation="3"/></filter><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#6C757D" points="0 0 10 3.5 0 7"/></marker><marker id="arrowBlue" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#2980B9" points="0 0 10 3.5 0 7"/></marker><marker id="arrowTeal" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#16A085" points="0 0 10 3.5 0 7"/></marker><marker id="arrowTealDash" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#1ABC9C" points="0 0 10 3.5 0 7"/></marker><linearGradient id="blueGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1"/><stop offset="100%" style="stop-color:#357abd;stop-opacity:1"/></linearGradient><linearGradient id="orangeGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#F39C12;stop-opacity:1"/><stop offset="100%" style="stop-color:#E67E22;stop-opacity:1"/></linearGradient><linearGradient id="greenGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1"/><stop offset="100%" style="stop-color:#449d44;stop-opacity:1"/></linearGradient></defs>

<!-- Background -->
<rect width="980" height="820" fill="#F8F9FA"/>

<!-- Title -->
<text x="490" y="42" fill="#2C3E50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Web Publication Flow</text>
<text x="490" y="67" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">pandoc conversion pipeline — docs-web/ → Read the Docs / GitBook</text>

