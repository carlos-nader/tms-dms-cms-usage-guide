<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100"><defs><filter id="sh" width="125%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="2" flood-opacity=".12" stdDeviation="3"/></filter><marker id="arr" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#6C757D" points="0 0 10 3.5 0 7"/></marker><marker id="arrG" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#27AE60" points="0 0 10 3.5 0 7"/></marker><marker id="arrP" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#8E44AD" points="0 0 10 3.5 0 7"/></marker><marker id="arrR" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#C0392B" points="0 0 10 3.5 0 7"/></marker></defs><rect width="1000" height="1100" fill="#EEF1F5"/><rect width="1000" height="72" x="0" y="0" fill="#1A252F"/><rect width="1000" height="4" x="0" y="68" fill="#8E44AD"/><text x="500" y="32" fill="#FFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Alpha Pre-Release Extension</text><text x="500" y="55" fill="#95A5A6" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Falcon BMS TMS/DMS/CMS Guide · WIP-FILE-NAMING + VERSION-SYSTEM · Optional parallel flow</text><rect width="960" height="40" x="20" y="84" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5" filter="url(#sh)" rx="5"/><text x="500" y="101" fill="#4A235A" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">⚠ The alpha flow is OPTIONAL and PARALLEL to the standard flow.</text><text x="500" y="117" fill="#4A235A" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Standard flow (dev → review → final → approved) remains intact and unaffected by alpha.</text><rect width="960" height="28" x="20" y="136" fill="#1E2D3D" rx="4"/><rect width="5" height="28" x="20" y="136" fill="#8E44AD" rx="2"/><text x="38" y="155" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">ALPHA STATUS &amp; WIP LIFECYCLE</text><line x1="490" x2="490" y1="168" y2="492" stroke="#CCD1D9" stroke-dasharray="4 3" stroke-width="1"/><text x="255" y="182" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" letter-spacing=".5" text-anchor="middle">STANDARD FLOW (unchanged — for reference)</text><rect width="160" height="44" x="175" y="192" fill="#2980B9" filter="url(#sh)" rx="22"/><text x="255" y="219" fill="#FFF" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">final</text><path stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrG)" d="M 255 236 L 255 262"/><text x="267" y="252" fill="#1E8449" font-family="Arial, sans-serif" font-size="9">integrate</text><rect width="178" height="44" x="165" y="264" fill="#1E8449" filter="url(#sh)" rx="22"/><text x="254" y="291" fill="#FFF" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">approved</text><rect width="178" height="20" x="165" y="314" fill="#D5F5E3" stroke="#1E8449" stroke-width="1" rx="4"/><text x="254" y="328" fill="#1E8449" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">archive/WIP/ (terminal)</text><rect width="456" height="74" x="25" y="352" fill="#FFF" filter="url(#sh)" rx="5"/><text x="253" y="370" fill="#1A5276" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">STANDARD vs. ALPHA — when to use each</text><line x1="29" x2="477" y1="375" y2="375" stroke="#D6EAF8" stroke-width=".8"/><text x="35" y="390" fill="#2C3E50" font-family="Arial, sans-serif" font-size="9">Standard: always available · WIP goes from final → approved after integration</text><text x="35" y="404" fill="#2C3E50" font-family="Arial, sans-serif" font-size="9">Alpha: only when pre-release infrastructure is active · author decides to</text><text x="35" y="418" fill="#2C3E50" font-family="Arial, sans-serif" font-size="9">publish a pre-release before the next official version bump</text><text x="740" y="182" fill="#8E44AD" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" letter-spacing=".5" text-anchor="middle">ALPHA FLOW (parallel — activated by author decision)</text><rect width="160" height="44" x="660" y="192" fill="#2980B9" filter="url(#sh)" rx="22"/><text x="740" y="219" fill="#FFF" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">final</text><path stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrP)" d="M 740 236 L 740 262"/><text x="752" y="252" fill="#8E44AD" font-family="Arial, sans-serif" font-size="9">author renames WIP</text><rect width="160" height="44" x="660" y="264" fill="#8E44AD" filter="url(#sh)" rx="22"/><text x="740" y="291" fill="#FFF" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">alpha</text><path fill="none" stroke="#C0392B" stroke-dasharray="3 2" stroke-width="1.2" marker-end="url(#arrR)" d="M 820 286 L 858 286"/><text x="864" y="283" fill="#C0392B" font-family="Arial, sans-serif" font-size="9" font-style="italic">or → deprecated</text><text x="864" y="296" fill="#C0392B" font-family="Arial, sans-serif" font-size="9" font-style="italic">(abandon)</text><rect width="180" height="20" x="650" y="314" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1" rx="4"/><text x="740" y="328" fill="#6C3483" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">wip/ · awaiting official promotion</text><path stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrG)" d="M 740 336 L 740 362"/><text x="752" y="352" fill="#1E8449" font-family="Arial, sans-serif" font-size="9">promote to official</text><rect width="180" height="44" x="650" y="364" fill="#1E8449" filter="url(#sh)" rx="22"/><text x="740" y="391" fill="#FFF" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">approved</text><rect width="180" height="20" x="650" y="414" fill="#D5F5E3" stroke="#1E8449" stroke-width="1" rx="4"/><text x="740" y="428" fill="#1E8449" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">archive/WIP/ · batch on official release</text><rect width="960" height="44" x="20" y="448" fill="#FDEDEC" stroke="#C0392B" stroke-dasharray="5 3" stroke-width="1.5" rx="5"/><text x="500" y="466" fill="#922B21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⛔ FORBIDDEN transitions from alpha</text><text x="500" y="483" fill="#7B241C" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">✗ alpha → final · ✗ alpha → review · ✗ alpha → dev (alpha status cannot be downgraded)</text><rect width="960" height="28" x="20" y="506" fill="#1E2D3D" rx="4"/><rect width="5" height="28" x="20" y="506" fill="#2980B9" rx="2"/><text x="38" y="525" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">ALPHA FILENAME PATTERNS</text><rect width="460" height="144" x="20" y="540" fill="#FFF" filter="url(#sh)" rx="5"/><rect width="5" height="144" x="20" y="540" fill="#8E44AD" rx="2"/><text x="35" y="560" fill="#4A235A" font-family="Arial, sans-serif" font-size="11" font-weight="bold">WIP File with Alpha Status</text><line x1="27" x2="472" y1="566" y2="566" stroke="#D2B4DE" stroke-width=".8"/><text x="35" y="582" fill="#5D6D7E" font-family="Arial, sans-serif" font-size="9.5">Pattern (status field = &quot;alpha&quot;):</text><rect width="445" height="22" x="27" y="587" fill="#F5EEF8" rx="3"/><text x="35" y="602" fill="#6C3483" font-family="Courier New, monospace" font-size="10.5">{type}-C{N}[-S{M}]-{title}-alpha-{DATE}.{ext}</text><text x="35" y="622" fill="#5D6D7E" font-family="Arial, sans-serif" font-size="9.5">Example:</text><text x="35" y="637" fill="#4A235A" font-family="Courier New, monospace" font-size="10.5">chapter-C5-style-rev-alpha-2026-02-27.tex</text><rect width="445" height="29" x="27" y="647" fill="#FFF9E6" stroke="#F39C12" stroke-width=".8" rx="3"/><text x="35" y="660" fill="#7D6608" font-family="Arial, sans-serif" font-size="9">⚠ Stays in wip/ — NOT moved to archive/WIP/ yet.</text><text x="35" y="673" fill="#7D6608" font-family="Arial, sans-serif" font-size="9">Archived in batch when official guide release is created.</text><rect width="480" height="144" x="500" y="540" fill="#FFF" filter="url(#sh)" rx="5"/><rect width="5" height="144" x="500" y="540" fill="#27AE60" rx="2"/><text x="515" y="560" fill="#1E8449" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Alpha Snapshot Pattern</text><line x1="507" x2="972" y1="566" y2="566" stroke="#A9DFBF" stroke-width=".8"/><text x="515" y="581" fill="#5D6D7E" font-family="Arial, sans-serif" font-size="9.5">Pattern (wip/ root — NOT in wip/guide/):</text><rect width="465" height="22" x="507" y="587" fill="#EAFAF1" stroke="#27AE60" stroke-width="1" rx="3"/><text x="740" y="602" fill="#1E8449" font-family="Courier New, monospace" font-size="10.5" text-anchor="middle">wip/guide-v0.M.P.S-alpha.N[.M]-YYYYMMDD.tex</text><text x="515" y="622" fill="#5D6D7E" font-family="Arial, sans-serif" font-size="9.5">N = chapter counter · M = correction counter (optional)</text><text x="515" y="638" fill="#2C3E50" font-family="Courier New, monospace" font-size="9">guide-v0.4.2.0-alpha.1-20260227.tex</text><text x="738" y="638" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="9">← C5 enters (N=1)</text><text x="515" y="653" fill="#2C3E50" font-family="Courier New, monospace" font-size="9">guide-v0.4.2.0-alpha.1.1-20260303.tex</text><text x="738" y="653" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="9">← correction (M=1)</text><text x="515" y="668" fill="#2C3E50" font-family="Courier New, monospace" font-size="9">guide-v0.4.2.0-alpha.2-20260310.tex</text><text x="738" y="668" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="9">← C1 enters (N=2, M gone)</text><rect width="960" height="28" x="20" y="700" fill="#1E2D3D" rx="4"/><rect width="5" height="28" x="20" y="700" fill="#E67E22" rx="2"/><text x="38" y="719" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">ALPHA VERSION COUNTERS (N and M)</text><rect width="540" height="24" x="20" y="732" fill="#D5D8DC"/><rect width="210" height="24" x="562" y="732" fill="#D5D8DC"/><rect width="206" height="24" x="774" y="732" fill="#D5D8DC"/><text x="38" y="748" fill="#4D5656" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold">Change in Snapshot</text><text x="667" y="748" fill="#4D5656" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Counter</text><text x="877" y="748" fill="#4D5656" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Example</text><rect width="960" height="36" x="20" y="756" fill="#FFF"/><text x="38" y="771" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10">New chapter enters the alpha snapshot</text><text x="38" y="785" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="9">(equivalent to MINOR in official versioning)</text><rect width="186" height="24" x="574" y="761" fill="#E67E22" rx="9"/><text x="667" y="777" fill="#FFF" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">N++ · M disappears</text><text x="877" y="777" fill="#4A235A" font-family="Courier New, monospace" font-size="9.5" text-anchor="middle">alpha.1 → alpha.2</text><rect width="960" height="36" x="20" y="792" fill="#F2F3F4"/><text x="38" y="807" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10">Correction below chapter level (structural or minor fix)</text><text x="38" y="821" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="9">(PATCH and SUBPATCH are both collapsed into M — no third level needed)</text><rect width="186" height="24" x="574" y="797" fill="#2980B9" rx="9"/><text x="667" y="813" fill="#FFF" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">M++ · N stays</text><text x="877" y="813" fill="#1A5276" font-family="Courier New, monospace" font-size="9.5" text-anchor="middle">alpha.1 → alpha.1.1</text><rect width="960" height="72" x="20" y="756" fill="none" stroke="#CCD1D9" stroke-width="1"/><line x1="560" x2="560" y1="732" y2="828" stroke="#CCD1D9" stroke-width="1"/><line x1="772" x2="772" y1="732" y2="828" stroke="#CCD1D9" stroke-width="1"/><line x1="20" x2="980" y1="792" y2="792" stroke="#E9ECEF" stroke-width=".8"/><rect width="960" height="22" x="20" y="832" fill="#FEF9E7" stroke="#F39C12" stroke-width="1" rx="3"/><text x="500" y="847" fill="#7D6608" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">When N increments, M disappears — clean state is alpha.N (not alpha.N.0) · Author decides all counter increments</text><rect width="960" height="28" x="20" y="868" fill="#1E2D3D" rx="4"/><rect width="5" height="28" x="20" y="868" fill="#27AE60" rx="2"/><text x="38" y="887" fill="#FFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">ALPHA RESPONSIBILITY (additions to standard matrix)</text><rect width="652" height="26" x="20" y="900" fill="#D5D8DC"/><rect width="148" height="26" x="675" y="900" fill="#D5F5E3"/><rect width="154" height="26" x="826" y="900" fill="#D6EAF8"/><text x="35" y="917" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold">Alpha-Specific Task</text><text x="749" y="917" fill="#1E8449" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">AI</text><text x="903" y="917" fill="#1A5276" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Author</text><rect width="960" height="30" x="20" y="926" fill="#FFF"/><text x="35" y="945" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10">Decide final → alpha (rename WIP to alpha status)</text><text x="749" y="945" fill="#E74C3C" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">✗ Cannot</text><text x="903" y="945" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">✓ Must decide</text><rect width="960" height="30" x="20" y="956" fill="#F2F3F4"/><text x="35" y="975" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10">Create alpha snapshot (wip/guide-v*-alpha.N[.M]-*.tex)</text><text x="749" y="975" fill="#E74C3C" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">✗ Cannot</text><text x="903" y="975" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">✓ Must do</text><rect width="960" height="30" x="20" y="986" fill="#FFF"/><text x="35" y="1005" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10">Create pre-release tag and GitHub pre-release</text><text x="749" y="1005" fill="#E74C3C" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">✗ Cannot</text><text x="903" y="1005" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">✓ Must do</text><rect width="960" height="90" x="20" y="926" fill="none" stroke="#CCD1D9" stroke-width="1"/><line x1="673" x2="673" y1="900" y2="1016" stroke="#CCD1D9" stroke-width="1"/><line x1="824" x2="824" y1="900" y2="1016" stroke="#CCD1D9" stroke-width="1"/><line x1="20" x2="980" y1="956" y2="956" stroke="#E9ECEF" stroke-width=".8"/><line x1="20" x2="980" y1="986" y2="986" stroke="#E9ECEF" stroke-width=".8"/><rect width="960" height="30" x="20" y="1020" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1" rx="3"/><text x="500" y="1033" fill="#4A235A" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">These 3 rows extend the standard responsibility matrix (WIP-FILE-NAMING §6).</text><text x="500" y="1045" fill="#4A235A" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle">All standard rules remain unchanged. Alpha transitions require explicit author decision — AI cannot initiate.</text><rect width="1000" height="30" x="0" y="1070" fill="#1A252F"/><text x="500" y="1088" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle">Alpha Pre-Release Extension · Effective March 2026 · Supplement to WIP-FILE-NAMING and VERSION-SYSTEM</text></svg>