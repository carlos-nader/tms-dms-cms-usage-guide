<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6C757D"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8E44AD"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="1000" height="1100" fill="#EEF1F5"/>

  <!-- ═══ HEADER ═══ -->
  <rect x="0" y="0" width="1000" height="72" fill="#1A252F"/>
  <rect x="0" y="68" width="1000" height="4" fill="#8E44AD"/>
  <text x="500" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Alpha Pre-Release Extension</text>
  <text x="500" y="55" font-family="Arial, sans-serif" font-size="13" fill="#95A5A6" text-anchor="middle">Falcon BMS TMS/DMS/CMS Guide · WIP-FILE-NAMING + VERSION-SYSTEM · Optional parallel flow</text>

  <!-- ═══ KEY PRINCIPLE BANNER ═══ -->
  <rect x="20" y="84" width="960" height="40" rx="5" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5" filter="url(#sh)"/>
  <text x="500" y="101" font-family="Arial, sans-serif" font-size="11.5" fill="#4A235A" text-anchor="middle" font-weight="bold">⚠  The alpha flow is OPTIONAL and PARALLEL to the standard flow.</text>
  <text x="500" y="117" font-family="Arial, sans-serif" font-size="11" fill="#4A235A" text-anchor="middle">Standard flow  (dev → review → final → approved)  remains intact and unaffected by alpha.</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SECTION A: ALPHA STATUS & WIP LIFECYCLE    -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="136" width="960" height="28" rx="4" fill="#1E2D3D"/>
  <rect x="20" y="136" width="5" height="28" rx="2" fill="#8E44AD"/>
  <text x="38" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ALPHA STATUS  &amp;  WIP LIFECYCLE</text>

  <!-- Column divider -->
  <line x1="490" y1="168" x2="490" y2="492" stroke="#CCD1D9" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── LEFT COLUMN: Standard flow reference ── -->
  <text x="255" y="182" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7F8C8D" text-anchor="middle" letter-spacing="0.5">STANDARD FLOW  (unchanged — for reference)</text>

  <!-- final node (standard) -->
  <rect x="175" y="192" width="160" height="44" rx="22" fill="#2980B9" filter="url(#sh)"/>
  <text x="255" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">final</text>

  <!-- Arrow final → approved (standard) -->
  <path d="M 255 236 L 255 262" stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="267" y="252" font-family="Arial, sans-serif" font-size="9" fill="#1E8449">integrate</text>

  <!-- approved node (standard) -->
  <rect x="165" y="264" width="178" height="44" rx="22" fill="#1E8449" filter="url(#sh)"/>
  <text x="254" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">approved</text>

  <!-- archive label (standard) -->
  <rect x="165" y="314" width="178" height="20" rx="4" fill="#D5F5E3" stroke="#1E8449" stroke-width="1"/>
  <text x="254" y="328" font-family="Arial, sans-serif" font-size="9" fill="#1E8449" text-anchor="middle">archive/WIP/  (terminal)</text>

  <!-- Info box left column -->
  <rect x="25" y="352" width="456" height="74" rx="5" fill="#FFFFFF" filter="url(#sh)"/>
  <text x="253" y="370" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1A5276" text-anchor="middle">STANDARD vs. ALPHA — when to use each</text>
  <line x1="29" y1="375" x2="477" y2="375" stroke="#D6EAF8" stroke-width="0.8"/>
  <text x="35" y="390" font-family="Arial, sans-serif" font-size="9" fill="#2C3E50">Standard:  always available  ·  WIP goes from final → approved after integration</text>
  <text x="35" y="404" font-family="Arial, sans-serif" font-size="9" fill="#2C3E50">Alpha:      only when pre-release infrastructure is active  ·  author decides to</text>
  <text x="35" y="418" font-family="Arial, sans-serif" font-size="9" fill="#2C3E50">            publish a pre-release before the next official version bump</text>

  <!-- ── RIGHT COLUMN: Alpha flow ── -->
  <text x="740" y="182" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#8E44AD" text-anchor="middle" letter-spacing="0.5">ALPHA FLOW  (parallel — activated by author decision)</text>

  <!-- final node (alpha path) -->
  <rect x="660" y="192" width="160" height="44" rx="22" fill="#2980B9" filter="url(#sh)"/>
  <text x="740" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">final</text>

  <!-- Arrow final → alpha -->
  <path d="M 740 236 L 740 262" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="752" y="252" font-family="Arial, sans-serif" font-size="9" fill="#8E44AD">author renames WIP</text>

  <!-- alpha node -->
  <rect x="660" y="264" width="160" height="44" rx="22" fill="#8E44AD" filter="url(#sh)"/>
  <text x="740" y="291" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">alpha</text>

  <!-- deprecated path (dashed, from right edge of alpha node) -->
  <path d="M 820 286 L 858 286" stroke="#C0392B" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)"/>
  <text x="864" y="283" font-family="Arial, sans-serif" font-size="9" fill="#C0392B" font-style="italic">or → deprecated</text>
  <text x="864" y="296" font-family="Arial, sans-serif" font-size="9" fill="#C0392B" font-style="italic">(abandon)</text>

  <!-- stays in wip/ label -->
  <rect x="650" y="314" width="180" height="20" rx="4" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="740" y="328" font-family="Arial, sans-serif" font-size="9" fill="#6C3483" text-anchor="middle">wip/  ·  awaiting official promotion</text>

  <!-- Arrow alpha → approved -->
  <path d="M 740 336 L 740 362" stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="752" y="352" font-family="Arial, sans-serif" font-size="9" fill="#1E8449">promote to official</text>

  <!-- approved node (alpha path) -->
  <rect x="650" y="364" width="180" height="44" rx="22" fill="#1E8449" filter="url(#sh)"/>
  <text x="740" y="391" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">approved</text>

  <!-- archive label (alpha path) -->
  <rect x="650" y="414" width="180" height="20" rx="4" fill="#D5F5E3" stroke="#1E8449" stroke-width="1"/>
  <text x="740" y="428" font-family="Arial, sans-serif" font-size="9" fill="#1E8449" text-anchor="middle">archive/WIP/  ·  batch on official release</text>

  <!-- FORBIDDEN TRANSITIONS strip -->
  <rect x="20" y="448" width="960" height="44" rx="5" fill="#FDEDEC" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="500" y="466" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#922B21" text-anchor="middle">⛔  FORBIDDEN transitions from alpha</text>
  <text x="500" y="483" font-family="Arial, sans-serif" font-size="10" fill="#7B241C" text-anchor="middle">✗  alpha → final   ·   ✗  alpha → review   ·   ✗  alpha → dev      (alpha status cannot be downgraded)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SECTION B: ALPHA FILENAME PATTERNS         -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="506" width="960" height="28" rx="4" fill="#1E2D3D"/>
  <rect x="20" y="506" width="5" height="28" rx="2" fill="#2980B9"/>
  <text x="38" y="525" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ALPHA FILENAME PATTERNS</text>

  <!-- Left box: WIP alpha file -->
  <rect x="20" y="540" width="460" height="144" rx="5" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="20" y="540" width="5" height="144" rx="2" fill="#8E44AD"/>
  <text x="35" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4A235A">WIP File with Alpha Status</text>
  <line x1="27" y1="566" x2="472" y2="566" stroke="#D2B4DE" stroke-width="0.8"/>
  <text x="35" y="582" font-family="Arial, sans-serif" font-size="9.5" fill="#5D6D7E">Pattern  (status field = "alpha"):</text>
  <rect x="27" y="587" width="445" height="22" rx="3" fill="#F5EEF8"/>
  <text x="35" y="602" font-family="Courier New, monospace" font-size="10.5" fill="#6C3483">{type}-C{N}[-S{M}]-{title}-alpha-{DATE}.{ext}</text>
  <text x="35" y="622" font-family="Arial, sans-serif" font-size="9.5" fill="#5D6D7E">Example:</text>
  <text x="35" y="637" font-family="Courier New, monospace" font-size="10.5" fill="#4A235A">chapter-C5-style-rev-alpha-2026-02-27.tex</text>
  <rect x="27" y="647" width="445" height="29" rx="3" fill="#FFF9E6" stroke="#F39C12" stroke-width="0.8"/>
  <text x="35" y="660" font-family="Arial, sans-serif" font-size="9" fill="#7D6608">⚠  Stays in wip/  — NOT moved to archive/WIP/ yet.</text>
  <text x="35" y="673" font-family="Arial, sans-serif" font-size="9" fill="#7D6608">   Archived in batch when official guide release is created.</text>

  <!-- Right box: Alpha snapshot pattern -->
  <rect x="500" y="540" width="480" height="144" rx="5" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="500" y="540" width="5" height="144" rx="2" fill="#27AE60"/>
  <text x="515" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E8449">Alpha Snapshot Pattern</text>
  <line x1="507" y1="566" x2="972" y2="566" stroke="#A9DFBF" stroke-width="0.8"/>
  <text x="515" y="581" font-family="Arial, sans-serif" font-size="9.5" fill="#5D6D7E">Pattern  (wip/ root — NOT in wip/guide/):</text>
  <rect x="507" y="587" width="465" height="22" rx="3" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
  <text x="740" y="602" font-family="Courier New, monospace" font-size="10.5" fill="#1E8449" text-anchor="middle">wip/guide-v0.M.P.S-alpha.N[.M]-YYYYMMDD.tex</text>
  <text x="515" y="622" font-family="Arial, sans-serif" font-size="9.5" fill="#5D6D7E">N = chapter counter  ·  M = correction counter (optional)</text>
  <text x="515" y="638" font-family="Courier New, monospace" font-size="9" fill="#2C3E50">guide-v0.4.2.0-alpha.1-20260227.tex</text>
  <text x="738" y="638" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">← C5 enters (N=1)</text>
  <text x="515" y="653" font-family="Courier New, monospace" font-size="9" fill="#2C3E50">guide-v0.4.2.0-alpha.1.1-20260303.tex</text>
  <text x="738" y="653" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">← correction (M=1)</text>
  <text x="515" y="668" font-family="Courier New, monospace" font-size="9" fill="#2C3E50">guide-v0.4.2.0-alpha.2-20260310.tex</text>
  <text x="738" y="668" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">← C1 enters (N=2, M gone)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SECTION C: ALPHA VERSION COUNTERS          -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="700" width="960" height="28" rx="4" fill="#1E2D3D"/>
  <rect x="20" y="700" width="5" height="28" rx="2" fill="#E67E22"/>
  <text x="38" y="719" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ALPHA VERSION COUNTERS  (N and M)</text>

  <!-- Column headers -->
  <rect x="20" y="732" width="540" height="24" fill="#D5D8DC"/>
  <rect x="562" y="732" width="210" height="24" fill="#D5D8DC"/>
  <rect x="774" y="732" width="206" height="24" fill="#D5D8DC"/>
  <text x="38" y="748" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#4D5656">Change in Snapshot</text>
  <text x="667" y="748" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#4D5656" text-anchor="middle">Counter</text>
  <text x="877" y="748" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#4D5656" text-anchor="middle">Example</text>

  <!-- Row 1: N++ -->
  <rect x="20" y="756" width="960" height="36" fill="#FFFFFF"/>
  <text x="38" y="771" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">New chapter enters the alpha snapshot</text>
  <text x="38" y="785" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">(equivalent to MINOR in official versioning)</text>
  <rect x="574" y="761" width="186" height="24" rx="9" fill="#E67E22"/>
  <text x="667" y="777" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFF" text-anchor="middle">N++  ·  M disappears</text>
  <text x="877" y="777" font-family="Courier New, monospace" font-size="9.5" fill="#4A235A" text-anchor="middle">alpha.1 → alpha.2</text>

  <!-- Row 2: M++ -->
  <rect x="20" y="792" width="960" height="36" fill="#F2F3F4"/>
  <text x="38" y="807" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Correction below chapter level (structural or minor fix)</text>
  <text x="38" y="821" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">(PATCH and SUBPATCH are both collapsed into M — no third level needed)</text>
  <rect x="574" y="797" width="186" height="24" rx="9" fill="#2980B9"/>
  <text x="667" y="813" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFF" text-anchor="middle">M++  ·  N stays</text>
  <text x="877" y="813" font-family="Courier New, monospace" font-size="9.5" fill="#1A5276" text-anchor="middle">alpha.1 → alpha.1.1</text>

  <!-- Table border and dividers -->
  <rect x="20" y="756" width="960" height="72" fill="none" stroke="#CCD1D9" stroke-width="1"/>
  <line x1="560" y1="732" x2="560" y2="828" stroke="#CCD1D9" stroke-width="1"/>
  <line x1="772" y1="732" x2="772" y2="828" stroke="#CCD1D9" stroke-width="1"/>
  <line x1="20" y1="792" x2="980" y2="792" stroke="#E9ECEF" stroke-width="0.8"/>

  <!-- Note under table -->
  <rect x="20" y="832" width="960" height="22" rx="3" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
  <text x="500" y="847" font-family="Arial, sans-serif" font-size="9.5" fill="#7D6608" text-anchor="middle">When N increments, M disappears — clean state is alpha.N (not alpha.N.0)  ·  Author decides all counter increments</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SECTION D: ALPHA RESPONSIBILITY MATRIX     -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="868" width="960" height="28" rx="4" fill="#1E2D3D"/>
  <rect x="20" y="868" width="5" height="28" rx="2" fill="#27AE60"/>
  <text x="38" y="887" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ALPHA RESPONSIBILITY  (additions to standard matrix)</text>

  <!-- Table header -->
  <rect x="20" y="900" width="652" height="26" fill="#D5D8DC"/>
  <rect x="675" y="900" width="148" height="26" fill="#D5F5E3"/>
  <rect x="826" y="900" width="154" height="26" fill="#D6EAF8"/>
  <text x="35" y="917" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#2C3E50">Alpha-Specific Task</text>
  <text x="749" y="917" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1E8449" text-anchor="middle">AI</text>
  <text x="903" y="917" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1A5276" text-anchor="middle">Author</text>

  <!-- Row 1 -->
  <rect x="20" y="926" width="960" height="30" fill="#FFFFFF"/>
  <text x="35" y="945" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Decide  final → alpha  (rename WIP to alpha status)</text>
  <text x="749" y="945" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C" text-anchor="middle">✗  Cannot</text>
  <text x="903" y="945" font-family="Arial, sans-serif" font-size="11" fill="#27AE60" text-anchor="middle">✓  Must decide</text>

  <!-- Row 2 -->
  <rect x="20" y="956" width="960" height="30" fill="#F2F3F4"/>
  <text x="35" y="975" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Create alpha snapshot  (wip/guide-v*-alpha.N[.M]-*.tex)</text>
  <text x="749" y="975" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C" text-anchor="middle">✗  Cannot</text>
  <text x="903" y="975" font-family="Arial, sans-serif" font-size="11" fill="#27AE60" text-anchor="middle">✓  Must do</text>

  <!-- Row 3 -->
  <rect x="20" y="986" width="960" height="30" fill="#FFFFFF"/>
  <text x="35" y="1005" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Create pre-release tag and GitHub pre-release</text>
  <text x="749" y="1005" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C" text-anchor="middle">✗  Cannot</text>
  <text x="903" y="1005" font-family="Arial, sans-serif" font-size="11" fill="#27AE60" text-anchor="middle">✓  Must do</text>

  <!-- Table border and dividers -->
  <rect x="20" y="926" width="960" height="90" fill="none" stroke="#CCD1D9" stroke-width="1"/>
  <line x1="673" y1="900" x2="673" y2="1016" stroke="#CCD1D9" stroke-width="1"/>
  <line x1="824" y1="900" x2="824" y2="1016" stroke="#CCD1D9" stroke-width="1"/>
  <line x1="20" y1="956" x2="980" y2="956" stroke="#E9ECEF" stroke-width="0.8"/>
  <line x1="20" y1="986" x2="980" y2="986" stroke="#E9ECEF" stroke-width="0.8"/>

  <!-- Note below matrix -->
  <rect x="20" y="1020" width="960" height="30" rx="3" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="500" y="1033" font-family="Arial, sans-serif" font-size="9.5" fill="#4A235A" text-anchor="middle">These 3 rows extend the standard responsibility matrix (WIP-FILE-NAMING §6).</text>
  <text x="500" y="1045" font-family="Arial, sans-serif" font-size="9.5" fill="#4A235A" text-anchor="middle">All standard rules remain unchanged. Alpha transitions require explicit author decision — AI cannot initiate.</text>

  <!-- ═══ FOOTER ═══ -->
  <rect x="0" y="1070" width="1000" height="30" fill="#1A252F"/>
  <text x="500" y="1088" font-family="Arial, sans-serif" font-size="10.5" fill="#7F8C8D" text-anchor="middle">Alpha Pre-Release Extension  ·  Effective March 2026  ·  Supplement to WIP-FILE-NAMING and VERSION-SYSTEM</text>
</svg>
