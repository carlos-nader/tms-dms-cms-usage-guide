<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 870">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1050" height="870" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="525" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">WIP File Life Cycle</text>
  <text x="525" y="65" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" text-anchor="middle">Standard flow and optional alpha pre-release path</text>

  <!-- Legend -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="990" height="35" rx="5" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="15" y="10" width="18" height="15" rx="3" fill="#5CB85C"/>
    <text x="40" y="22" font-family="Arial, sans-serif" font-size="11" fill="#495057">Read-only (template)</text>
    <rect x="188" y="10" width="18" height="15" rx="3" fill="#F0AD4E"/>
    <text x="213" y="22" font-family="Arial, sans-serif" font-size="11" fill="#495057">Active work (wip/)</text>
    <rect x="360" y="10" width="18" height="15" rx="3" fill="#1565C0"/>
    <text x="385" y="22" font-family="Arial, sans-serif" font-size="11" fill="#495057">Alpha pre-release (wip/)</text>
    <rect x="560" y="10" width="18" height="15" rx="3" fill="#5BC0DE"/>
    <text x="585" y="22" font-family="Arial, sans-serif" font-size="11" fill="#495057">Guide snapshots</text>
    <rect x="710" y="10" width="18" height="15" rx="3" fill="#D9EDF7"/>
    <text x="735" y="22" font-family="Arial, sans-serif" font-size="11" fill="#495057">Archived</text>
    <rect x="818" y="10" width="18" height="15" rx="3" fill="#F5F5F5" stroke="#DEE2E6" stroke-width="1"/>
    <text x="843" y="22" font-family="Arial, sans-serif" font-size="11" fill="#495057">Documentation</text>
  </g>

  <!-- Project Root -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#2C3E50" filter="url(#shadow)"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">project-root/</text>
  </g>

  <!-- Vertical spine from root -->
  <path d="M 170 170 L 200 170" stroke="#6C757D" stroke-width="2"/>
  <path d="M 200 170 L 200 720" stroke="#6C757D" stroke-width="2"/>

  <!-- templates/ -->
  <g transform="translate(220, 145)">
    <path d="M -20 25 L 0 25" stroke="#6C757D" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="90" rx="8" fill="#5CB85C" filter="url(#shadow)"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="13" fill="#FFF" font-weight="bold">templates/</text>
    <rect x="15" y="38" width="250" height="22" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="25" y="54" font-family="Arial, sans-serif" font-size="11" fill="#FFF">template-wip.tex</text>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" font-style="italic">⚠ NEVER modify directly — always copy first</text>
  </g>

  <!-- wip/ -->
  <g transform="translate(220, 255)">
    <path d="M -20 100 L 0 100" stroke="#6C757D" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="235" rx="8" fill="#F0AD4E" filter="url(#shadow)"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="13" fill="#FFF" font-weight="bold">wip/</text>

    <rect x="15" y="36" width="250" height="20" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#FFF">chapter-C4-dms-review-2026-02-01.tex</text>

    <rect x="15" y="59" width="250" height="20" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="25" y="73" font-family="Arial, sans-serif" font-size="10" fill="#FFF">section-C3-S2-fcr-dev-2026-01-15.tex</text>

    <rect x="15" y="82" width="250" height="20" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="25" y="96" font-family="Arial, sans-serif" font-size="10" fill="#FFF">table-C5-ALLM-CMS-final-2026-01-22.tex</text>

    <!-- Alpha snapshot (dark blue) -->
    <rect x="15" y="106" width="250" height="22" rx="3" fill="#1565C0"/>
    <text x="25" y="121" font-family="Arial, sans-serif" font-size="10" fill="#FFF" font-weight="bold">guide-v0.4.2.0-alpha.1-20260301.tex  α</text>
    <text x="15" y="142" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)" font-style="italic">↑ alpha snapshots live here, not in guide/</text>

    <!-- wip/guide/ subfolder -->
    <rect x="15" y="152" width="250" height="50" rx="5" fill="#5BC0DE"/>
    <text x="25" y="170" font-family="Arial, sans-serif" font-size="11" fill="#FFF" font-weight="bold">guide/</text>
    <text x="35" y="188" font-family="Arial, sans-serif" font-size="10" fill="#FFF">guide-v0.4.1.1-20260218.tex</text>

    <text x="15" y="222" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)" font-style="italic">⤷ official snapshots only</text>
  </g>

  <!-- archive/ -->
  <g transform="translate(220, 508)">
    <path d="M -20 65 L 0 65" stroke="#6C757D" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="170" rx="8" fill="#D9EDF7" filter="url(#shadow)"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="13" fill="#31708F" font-weight="bold">archive/</text>

    <rect x="15" y="38" width="250" height="55" rx="5" fill="#5BC0DE"/>
    <text x="25" y="56" font-family="Arial, sans-serif" font-size="11" fill="#FFF" font-weight="bold">GUIDE/</text>
    <text x="35" y="74" font-family="Arial, sans-serif" font-size="10" fill="#FFF">guide-v0.3.2.1-20260129.tex</text>
    <text x="35" y="88" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Previous official snapshots</text>

    <rect x="15" y="100" width="250" height="60" rx="5" fill="#DFF0D8"/>
    <text x="25" y="118" font-family="Arial, sans-serif" font-size="11" fill="#3C763D" font-weight="bold">WIP/</text>
    <text x="35" y="136" font-family="Arial, sans-serif" font-size="10" fill="#3C763D">section-C4-S3-approved-2026-01-19.tex</text>
    <text x="35" y="152" font-family="Arial, sans-serif" font-size="10" fill="#A94442">table-C3-AA-TMS-deprecated-2026-01-22.tex</text>
  </g>

  <!-- docs/ -->
  <g transform="translate(220, 695)">
    <path d="M -20 25 L 0 25" stroke="#6C757D" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="60" rx="8" fill="#F5F5F5" stroke="#DEE2E6" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="13" fill="#495057" font-weight="bold">docs/</text>
    <text x="25" y="42" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">project-tracking.md, version-system.md,</text>
    <text x="25" y="54" font-family="Arial, sans-serif" font-size="10" fill="#6C757D">wip-naming.md, briefing.md</text>
  </g>

  <!-- ============================= -->
  <!-- Status Flow (right side)      -->
  <!-- ============================= -->
  <g transform="translate(548, 145)">
    <rect x="0" y="0" width="482" height="548" rx="10" fill="#FFF" stroke="#DEE2E6" stroke-width="2" filter="url(#shadow)"/>
    <text x="241" y="30" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" text-anchor="middle" font-weight="bold">Status Flow</text>

    <!-- dev -->
    <rect x="20" y="50" width="280" height="48" rx="24" fill="#F1C40F"/>
    <text x="160" y="73" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">dev</text>
    <text x="160" y="89" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">wip/ — Never reviewed</text>

    <!-- dev → review -->
    <path d="M 160 102 L 160 122" stroke="#6C757D" stroke-width="2"/>
    <polygon points="160,127 155,119 165,119" fill="#6C757D"/>

    <!-- review -->
    <rect x="20" y="130" width="280" height="48" rx="24" fill="#E67E22"/>
    <text x="160" y="153" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">review</text>
    <text x="160" y="169" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">wip/ — Under human iteration</text>

    <!-- review → final -->
    <path d="M 160 182 L 160 202" stroke="#6C757D" stroke-width="2"/>
    <polygon points="160,207 155,199 165,199" fill="#6C757D"/>

    <!-- final -->
    <rect x="20" y="210" width="280" height="48" rx="24" fill="#3498DB"/>
    <text x="160" y="233" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">final</text>
    <text x="160" y="249" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">wip/ — Ready to integrate</text>

    <!-- Fork: standard (straight down, left-of-center) -->
    <path d="M 110 262 L 110 308" stroke="#6C757D" stroke-width="2"/>
    <polygon points="110,313 105,305 115,305" fill="#6C757D"/>
    <text x="76" y="288" font-family="Arial, sans-serif" font-size="9" fill="#6C757D">std.</text>

    <!-- Fork: alpha branch (right side of final → dashed right to alpha node) -->
    <path d="M 302 234 L 335 234" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="340,234 332,230 332,238" fill="#1565C0"/>

    <!-- alpha node -->
    <rect x="343" y="212" width="120" height="58" rx="10" fill="#1565C0" filter="url(#shadow)"/>
    <text x="403" y="235" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">alpha</text>
    <text x="403" y="251" font-family="Arial, sans-serif" font-size="9" fill="#90CAF9" text-anchor="middle">optional</text>
    <text x="403" y="263" font-family="Arial, sans-serif" font-size="9" fill="#90CAF9" text-anchor="middle">pre-release only</text>

    <!-- alpha → approved (down then left, dashed) -->
    <path d="M 403 272 L 403 335 L 303 335" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
    <polygon points="300,335 308,331 308,339" fill="#1565C0"/>
    <text x="368" y="320" font-family="Arial, sans-serif" font-size="9" fill="#1565C0">batch</text>

    <!-- approved -->
    <rect x="20" y="316" width="280" height="48" rx="24" fill="#27AE60"/>
    <text x="160" y="339" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">approved</text>
    <text x="160" y="355" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">archive/WIP/ — Integrated (terminal)</text>

    <!-- deprecated -->
    <rect x="20" y="400" width="280" height="48" rx="24" fill="#E74C3C"/>
    <text x="160" y="423" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">deprecated</text>
    <text x="160" y="439" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">archive/WIP/ — Abandoned (terminal)</text>

    <!-- Deprecated dashed arrows (left spine) from dev, review, final -->
    <path d="M 20 74 L 6 74 L 6 424 L 18 424" stroke="#E74C3C" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
    <path d="M 20 154 L 10 154 L 10 424 L 18 424" stroke="#E74C3C" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
    <path d="M 20 234 L 14 234 L 14 424 L 18 424" stroke="#E74C3C" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>

    <!-- Deprecated dashed arrow from alpha (right spine) -->
    <path d="M 463 241 L 472 241 L 472 424 L 302 424" stroke="#E74C3C" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>

    <!-- Alpha path note box -->
    <rect x="10" y="467" width="462" height="62" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="241" y="487" font-family="Arial, sans-serif" font-size="10" fill="#1565C0" text-anchor="middle" font-weight="bold">Alpha path — activated only with pre-release infrastructure</text>
    <text x="241" y="504" font-family="Arial, sans-serif" font-size="10" fill="#1565C0" text-anchor="middle">WIP files remain in wip/ until official release;</text>
    <text x="241" y="521" font-family="Arial, sans-serif" font-size="10" fill="#1565C0" text-anchor="middle">then batch-archived as approved alongside the official snapshot</text>
  </g>

  <!-- guide.tex note -->
  <g transform="translate(548, 708)">
    <rect x="0" y="0" width="482" height="55" rx="8" fill="#2C3E50" filter="url(#shadow)"/>
    <text x="241" y="22" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="bold">guide.tex (repository root)</text>
    <text x="241" y="42" font-family="Arial, sans-serif" font-size="10" fill="#BDC3C7" text-anchor="middle">Canonical file — byte-identical to current official snapshot</text>
  </g>

  <!-- Footer -->
  <text x="525" y="850" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D" text-anchor="middle">WIP-FILE-NAMING | Folder structure, status lifecycle, and alpha pre-release path</text>
</svg>
