# Travis CI configuration for projeto-bms (LaTeX guide)
# Builds the PDF and runs lightweight repo validations.

os: linux
dist: focal
language: shell

# Skip jobs when only non-build-relevant files changed.
# Relevant paths: guide.tex, wip/, archive/, ci/, scripts/, fig/,
#                 docs-web/, mkdocs.yml, .travis.yml, docs/guide-web.pdf
# GitGuardian overrides this with its own before_install — always runs.
before_install:
  - |
    if [ -n "${TRAVIS_COMMIT_RANGE:-}" ]; then
      changed=$(git diff --name-only "${TRAVIS_COMMIT_RANGE}" 2>/dev/null || true)
      if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qE \
        '^(guide\.tex|wip/|archive/|ci/|scripts/|fig/|docs-web/|mkdocs\.yml|\.travis\.yml|docs/guide-web\.pdf)'; then
        echo "No build-relevant files changed — skipping job."
        travis_terminate 0
      fi
    fi

jobs:
  include:
    - name: GitGuardian Scan
      language: python
      python: "3.11"
      before_install: echo "GitGuardian always runs — scanning all commits for secrets."
      git:
        depth: false
      install:
        - pip install ggshield
      script:
        - ggshield secret scan ci

    - name: Build and Validate
      language: shell
      git:
        depth: false
      addons:
        apt:
          packages:
            - python3
            - latexmk
            - lmodern
            - texlive-latex-base
            - texlive-latex-recommended
            - texlive-latex-extra
            - texlive-fonts-recommended
            - texlive-lang-english
      cache:
        apt: true
      script:
        - bash ci/travis.sh

    - name: Integrity Check
      language: shell
      git:
        depth: false
      script:
        - |
          echo "=== Check 1: guide.tex vs active snapshot ==="
          snapshot=$(find wip/guide -maxdepth 1 -name "*.tex" | head -n 1)
          if [ -z "$snapshot" ]; then
            echo "ERROR: no active snapshot found in wip/guide/"
            exit 1
          fi
          echo "Comparing guide.tex with $snapshot"
          if cmp -s guide.tex "$snapshot"; then
            echo "OK: guide.tex is byte-identical to $snapshot"
          else
            echo "FAIL: guide.tex differs from $snapshot"
            diff guide.tex "$snapshot" || true
            exit 1
          fi

          echo "=== Check 2: guide.pdf vs docs/guide-web.pdf ==="
          if cmp -s guide.pdf docs/guide-web.pdf; then
            echo "OK: guide.pdf is byte-identical to docs/guide-web.pdf"
          else
            echo "FAIL: guide.pdf differs from docs/guide-web.pdf (sync workflow may not have run)"
            exit 1
          fi

    - name: Validate docs-web (MkDocs)
      language: python
      python: "3.11"
      git:
        depth: false
      install:
        - pip install mkdocs
      script:
        - mkdocs build

    - name: Build Alpha
      language: shell
      git:
        depth: false
      addons:
        apt:
          packages:
            - latexmk
            - lmodern
            - texlive-latex-base
            - texlive-latex-recommended
            - texlive-latex-extra
            - texlive-fonts-recommended
            - texlive-lang-english
      cache:
        apt: true
      script:
        - |
          alpha=$(find wip -maxdepth 1 -name "guide-v*-alpha.*.tex" | head -n 1)
          if [ -z "$alpha" ]; then
            echo "No alpha snapshot found — skipping."
            exit 0
          fi
          echo "Building alpha: $alpha"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -silent "$alpha"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -silent "$alpha"
          echo "Alpha build OK."
