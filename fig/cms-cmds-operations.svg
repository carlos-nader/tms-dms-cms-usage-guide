<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505"
     font-family="Consolas,'Courier New',monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#666"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="2.5" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="505" fill="#f0f0f0" rx="10"/>

  <!-- Title -->
  <text x="480" y="17" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="bold" fill="#222">
    CMS — CMDS Operations
  </text>

  <!-- ═══ ARROWS ═══ -->
  <!-- CMS → UP -->
  <line x1="480" y1="215" x2="480" y2="148" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <!-- CMS → DOWN -->
  <line x1="480" y1="299" x2="480" y2="360" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <!-- CMS → LEFT -->
  <line x1="437" y1="257" x2="307" y2="257" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <!-- CMS → RIGHT -->
  <line x1="523" y1="257" x2="665" y2="257" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ UP BOX ═══ -->
  <rect x="330" y="28" width="300" height="120" rx="7" fill="#f8f8f8" stroke="#999" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="330" y="28" width="300" height="28" rx="7" fill="#cccccc"/>
  <rect x="330" y="44"  width="300" height="12" fill="#cccccc"/>
  <text x="480" y="46" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#222">↑  CMS UP</text>
  <line x1="342" y1="60" x2="618" y2="60" stroke="#bbb" stroke-width="0.8"/>

  <text x="344" y="78" font-size="11" font-weight="bold" fill="#222">MAN / AUTO / SEMI</text>
  <text x="354" y="94" font-size="11" fill="#444">Execute Program 1–4</text>
  <text x="344" y="114" font-size="11" font-weight="bold" fill="#222">BYP</text>
  <text x="354" y="130" font-size="11" fill="#444">1 chaff + 1 flare</text>

  <!-- ═══ LEFT BOX ═══ -->
  <rect x="12" y="212" width="295" height="90" rx="7" fill="#f8f8f8" stroke="#999" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="12" y="212" width="295" height="28" rx="7" fill="#cccccc"/>
  <rect x="12" y="228"  width="295" height="12" fill="#cccccc"/>
  <text x="159" y="230" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#222">←  CMS LEFT</text>
  <line x1="25" y1="244" x2="294" y2="244" stroke="#bbb" stroke-width="0.8"/>

  <text x="25" y="262" font-size="11" font-weight="bold" fill="#222">MAN / AUTO / SEMI / BYP</text>
  <text x="35" y="279" font-size="11" fill="#444">Execute Program 6</text>

  <!-- ═══ CMS CENTER ═══ -->
  <circle cx="480" cy="257" r="42" fill="#aaaaaa" stroke="#666" stroke-width="2" filter="url(#sh)"/>
  <circle cx="480" cy="257" r="22" fill="#666" stroke="#444" stroke-width="1.5"/>
  <circle cx="480" cy="257" r="9"  fill="#333"/>
  <text x="480" y="314" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="bold" fill="#555">CMS</text>

  <!-- ═══ RIGHT BOX ═══ -->
  <rect x="665" y="212" width="283" height="90" rx="7" fill="#f8f8f8" stroke="#999" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="665" y="212" width="283" height="28" rx="7" fill="#cccccc"/>
  <rect x="665" y="228"  width="283" height="12" fill="#cccccc"/>
  <text x="806" y="230" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#222">→  CMS RIGHT</text>
  <line x1="678" y1="244" x2="935" y2="244" stroke="#bbb" stroke-width="0.8"/>

  <text x="678" y="262" font-size="11" font-weight="bold" fill="#222">AUTO / SEMI</text>
  <text x="688" y="279" font-size="11" fill="#444">Cancel consent — CMDS to Standby</text>

  <!-- ═══ DOWN BOX ═══ -->
  <rect x="305" y="360" width="350" height="132" rx="7" fill="#f8f8f8" stroke="#999" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="305" y="360" width="350" height="28" rx="7" fill="#cccccc"/>
  <rect x="305" y="376"  width="350" height="12" fill="#cccccc"/>
  <text x="480" y="378" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="bold" fill="#222">↓  CMS DOWN</text>
  <line x1="318" y1="392" x2="642" y2="392" stroke="#bbb" stroke-width="0.8"/>

  <text x="318" y="410" font-size="11" font-weight="bold" fill="#222">AUTO</text>
  <text x="328" y="426" font-size="11" fill="#444">Grant consent — enable AUTO dispensing</text>
  <text x="318" y="447" font-size="11" font-weight="bold" fill="#222">SEMI</text>
  <text x="328" y="463" font-size="11" fill="#444">Grant consent — one program</text>
  <text x="328" y="479" font-size="11" fill="#444">per COUNTER voice message</text>

</svg>
